<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Bancos - NursingQuiz Cloud</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; }
.topbar { background: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 10; }
.topbar h1 { color: #2563eb; font-size: 1.25rem; }
.topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; text-decoration: none; display: inline-block; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { background: #dc2626; color: white; }
.btn-danger:hover { opacity: 0.9; }
.btn-outline { background: transparent; color: #374151; border: 1px solid #d1d5db; }
.btn-outline:hover { background: #f3f4f6; }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
.teacher-name { color: #6b7280; font-size: 0.875rem; margin-right: 8px; }
.container { max-width: 800px; margin: 0 auto; padding: 20px; }
.empty { text-align: center; padding: 40px 20px; color: #6b7280; }
.empty p { margin-top: 8px; font-size: 0.875rem; }
.bank-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); transition: box-shadow 0.2s; }
.bank-card:active { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.bank-title { font-size: 1.125rem; font-weight: 600; color: #111827; margin-bottom: 4px; }
.bank-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: #6b7280; margin-top: 8px; }
.bank-meta span { display: flex; align-items: center; gap: 4px; }
.bank-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.share-code { background: #f3f4f6; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 0.875rem; color: #2563eb; font-weight: 600; letter-spacing: 1px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
.modal h2 { font-size: 1.25rem; margin-bottom: 16px; color: #111827; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px; }
input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; outline: none; font-family: inherit; }
input:focus, textarea:focus { border-color: #2563eb; }
textarea { min-height: 80px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }
.loading { text-align: center; padding: 40px; color: #6b7280; }
.spinner { border: 3px solid #e5e7eb; border-top: 3px solid #2563eb; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.875rem; z-index: 200; display: none; }
.toast.show { display: block; animation: fadeInUp 0.3s; }
@keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@media (max-width: 480px) {
  .topbar { padding: 12px 16px; }
  .topbar h1 { font-size: 1rem; }
  .container { padding: 12px; }
  .bank-card { padding: 12px; }
}
</style>
</head>
<body>
<div class="topbar">
  <h1>🏥 Mis Bancos</h1>
  <div class="topbar-actions">
    <span class="teacher-name" id="teacherName"></span>
    <button class="btn btn-primary btn-sm" onclick="showNewBankModal()">+ Nuevo</button>
    <a href="/sessions" class="btn btn-outline btn-sm">Resultados</a>
    <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
  </div>
</div>

<div class="container" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Cargando bancos...</p>
  </div>
</div>

<div class="modal-overlay" id="newBankModal">
  <div class="modal">
    <h2>Nuevo banco</h2>
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="newBankTitle" placeholder="Ej: Enfermería General">
    </div>
    <div class="form-group">
      <label>Descripción (opcional)</label>
      <textarea id="newBankDesc" placeholder="Describí el contenido del banco..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="createBank()">Crear</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let banks = [];

function getToken() {
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = '/'; return null; }
  return token;
}

function getHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + getToken()
  };
}

async function loadBanks() {
  document.getElementById('loading').style.display = 'block';
  const container = document.getElementById('app');

  try {
    const res = await fetch(API + '/banks', { headers: getHeaders() });
    if (res.status === 401) { localStorage.clear(); window.location.href = '/'; return; }
    const data = await res.json();
    banks = data.banks;
    renderBanks();
  } catch (err) {
    container.innerHTML = '<div class="empty"><p>Error al cargar los bancos</p></div>';
  }
}

function renderBanks() {
  const container = document.getElementById('app');
  document.getElementById('loading').style.display = 'none';

  if (banks.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <p style="font-size:2rem;">📝</p>
        <p><strong>No tenés bancos de preguntas aún</strong></p>
        <p>Creá tu primer banco para empezar a compartir preguntas</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="showNewBankModal()">Crear primer banco</button>
      </div>`;
    return;
  }

  container.innerHTML = banks.map(b => `
    <div class="bank-card">
      <div class="bank-title">${escHtml(b.title)}</div>
      ${b.description ? `<p style="color:#6b7280;font-size:0.875rem;margin-top:4px">${escHtml(b.description)}</p>` : ''}
      <div class="bank-meta">
        <span>📄 ${b.question_count} preguntas</span>
        <span>Código: <span class="share-code">${b.share_code}</span></span>
        <span>🕐 ${new Date(b.created_at).toLocaleDateString()}</span>
      </div>
      <div class="bank-actions">
        <button class="btn btn-primary btn-sm" onclick="viewBank(${b.id})">Ver</button>
        <button class="btn btn-outline btn-sm" onclick="shareBank('${b.share_code}')">Compartir</button>
        <button class="btn btn-outline btn-sm" onclick="editBank(${b.id})">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteBank(${b.id})">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function viewBank(id) {
  window.location.href = '/bank.html?id=' + id;
}

function shareBank(code) {
  const url = window.location.origin + '/api/share/' + code + '/export';
  const shareText = `🏥 Código: ${code}\n📥 Importar: ${url}`;

  if (navigator.share) {
    navigator.share({ title: 'Banco de preguntas', text: shareText });
  } else {
    navigator.clipboard.writeText(code).then(() => showToast('Código copiado: ' + code));
  }
}

function editBank(id) {
  const bank = banks.find(b => b.id === id);
  if (!bank) return;

  document.getElementById('newBankTitle').value = bank.title;
  document.getElementById('newBankDesc').value = bank.description || '';
  document.getElementById('newBankModal').dataset.editId = id;
  document.querySelector('#newBankModal h2').textContent = 'Editar banco';
  document.getElementById('newBankModal').classList.add('active');
}

function showNewBankModal() {
  document.getElementById('newBankTitle').value = '';
  document.getElementById('newBankDesc').value = '';
  delete document.getElementById('newBankModal').dataset.editId;
  document.querySelector('#newBankModal h2').textContent = 'Nuevo banco';
  document.getElementById('newBankModal').classList.add('active');
}

function closeModal() {
  document.getElementById('newBankModal').classList.remove('active');
}

async function createBank() {
  const title = document.getElementById('newBankTitle').value.trim();
  const description = document.getElementById('newBankDesc').value.trim();
  const editId = document.getElementById('newBankModal').dataset.editId;

  if (!title) { showToast('El título es requerido'); return; }

  try {
    const url = editId ? API + '/banks/' + editId : API + '/banks';
    const method = editId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: getHeaders(), body: JSON.stringify({ title, description }) });
    if (!res.ok) { const data = await res.json(); showToast(data.error || 'Error al guardar'); return; }
    closeModal();
    await loadBanks();
  } catch (err) {
    showToast('Error de conexión');
  }
}

async function deleteBank(id) {
  if (!confirm('¿Eliminar este banco y todas sus preguntas?')) return;

  try {
    await fetch(API + '/banks/' + id, { method: 'DELETE', headers: getHeaders() });
    loadBanks();
  } catch (err) {
    showToast('Error al eliminar');
  }
}

function logout() {
  localStorage.clear();
  window.location.href = '/';
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

const teacher = JSON.parse(localStorage.getItem('teacher') || '{}');
document.getElementById('teacherName').textContent = teacher.name || '';

loadBanks();

document.getElementById('newBankModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NursingQuiz Cloud</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 32px 24px; width: 90%; max-width: 400px; }
h1 { text-align: center; color: #2563eb; font-size: 1.5rem; margin-bottom: 4px; }
.subtitle { text-align: center; color: #6b7280; font-size: 0.875rem; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 4px; }
input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; outline: none; transition: border 0.2s; }
input:focus { border-color: #2563eb; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: #e5e7eb; color: #374151; }
.btn-secondary:hover { opacity: 0.9; }
.error { color: #dc2626; font-size: 0.875rem; text-align: center; margin-top: 8px; display: none; }
.switch { text-align: center; margin-top: 16px; font-size: 0.875rem; color: #6b7280; }
.switch a { color: #2563eb; text-decoration: none; font-weight: 600; }
.loading { text-align: center; padding: 20px; color: #6b7280; display: none; }
.spinner { border: 3px solid #e5e7eb; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>🏥 NursingQuiz Cloud</h1>
  <p class="subtitle">Sincroniza tus bancos de preguntas</p>

  <div id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="login()">Iniciar sesión</button>
    <div class="error" id="loginError"></div>
    <div class="switch">¿No tienes cuenta? <a href="/register">Regístrate</a></div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Conectando...</p>
  </div>
</div>

<script>
const API = '/api';

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');

  if (!email || !password) {
    errorEl.textContent = 'Completa todos los campos';
    errorEl.style.display = 'block';
    return;
  }

  errorEl.style.display = 'none';
  showLoading(true);

  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorEl.textContent = data.error || 'Error al iniciar sesión';
      errorEl.style.display = 'block';
      showLoading(false);
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('teacher', JSON.stringify(data.teacher));
    window.location.href = '/dashboard';
  } catch (err) {
    errorEl.textContent = 'Error de conexión';
    errorEl.style.display = 'block';
    showLoading(false);
  }
}

function showLoading(show) {
  document.getElementById('loginForm').style.display = show ? 'none' : 'block';
  document.getElementById('loading').style.display = show ? 'block' : 'none';
}
</script>
</body>
</html>
